spring.application.name=backend-gimnasio

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/gym?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase (lo podés activar cuando tengas tus changelogs)
spring.liquibase.change-log=classpath:liquibase/master_changelog.xml
spring.liquibase.enabled=false

#Hibernate
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.stat=OFF
